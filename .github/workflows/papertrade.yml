# Daily harvest -> research -> settle -> learn pipeline: runs on GitHub's own runners, so it needs no Claude session, no container and no
# repo attachment. Evening run = harvest + price + grade; midday run = grade only (results of last night settle).
# Any failure (bad exit code, empty snapshot, push conflict) marks the run red and GitHub emails the repo owner.
name: papertrade
on:
  schedule:
    - cron: '40 21 * * *'   # 22:40 Africa/Lagos: full run (harvest next 30h, price, grade, journal)
    - cron: '0 11 * * *'    # 12:00 Africa/Lagos: grade-only catch-up after overnight results settle
  workflow_dispatch:
    inputs:
      mode: {description: 'full or grade', default: 'full', required: false}
permissions:
  contents: write
concurrency: {group: papertrade, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/sports-accumulator-analysis-8su67, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q numpy scipy
      - name: Restore API cache (Sportradar/SportyBet responses, ~400MB)
        uses: actions/cache@v4
        with:
          path: engine/cache
          key: engine-cache-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Pipeline
        working-directory: engine
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then [ "${{ github.event.schedule }}" = '0 11 * * *' ] && MODE=grade || MODE=full; fi
          echo "mode=$MODE"
          python3 health.py reset
          if [ "$MODE" = grade ]; then python3 health.py run grade --timeout 3600 -- python3 grade.py
          else python3 health.py run daily --timeout 5400 -- python3 daily.py; fi
      # Every step below runs through health.py: a failure is recorded in papertrade/health.json and shown in the
      # journal, later steps still run, and the final step turns the run red. Nothing fails silently any more.
      - name: Market tape (every market on every fixture, unfiltered)
        if: always()
        working-directory: engine
        run: |
          python3 health.py run tape_harvest --timeout 2400 -- python3 -W ignore tape_harvest.py 30
          # Automated data research on EVERY harvested fixture, stored BEFORE kick-off so it can be graded honestly
          B="cache/tapeboard_$(date -u +%F).json"
          [ -f "$B" ] && python3 health.py run form_research --timeout 2400 -- python3 -W ignore allform.py "$B" cache/allform_ci.json "../papertrade/form/$(date -u +%F_%H%M)_ci.csv.gz"
          python3 health.py run tape_grade   --timeout 3000 -- python3 -W ignore tape_grade.py 6
          python3 health.py run tape_report  --timeout 900  -- python3 -W ignore tape_report.py
          # The learning loop: calibration corrections, form-vs-price weight, research scorecard -> learned.json
          python3 health.py run learn        --timeout 900  -- python3 -W ignore learn.py
      - name: Settle posted tickets
        if: always()
        working-directory: engine
        run: python3 health.py run settle_tickets --timeout 900 -- python3 -W ignore settle_tickets.py
      - name: Journal (always, so failures are recorded too)
        if: always()
        working-directory: engine
        run: python3 health.py run journal --timeout 300 -- python3 -W ignore journal.py
      - name: Commit and push results
        if: always()
        run: |
          git config user.name 'papertrade-bot'
          git config user.email 'papertrade-bot@users.noreply.github.com'
          git add papertrade engine/data engine/coef_*.json
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -q -m "papertrade: automated run $(date -u +%F' '%H:%M) UTC"
          for i in 1 2 3 4 5; do
            # Rebase first; if a session pushed the same generated file meanwhile, abort and merge preferring this
            # run's regenerated outputs (-X ours). tickets.txt / legs.jsonl use the union driver (.gitattributes).
            if git pull -q --rebase --autostash origin claude/sports-accumulator-analysis-8su67; then :; else
              git rebase --abort 2>/dev/null || true
              git pull -q --no-rebase --no-edit -X ours origin claude/sports-accumulator-analysis-8su67 || { git merge --abort 2>/dev/null; sleep $((i*i*5)); continue; }
            fi
            git push -q origin HEAD:claude/sports-accumulator-analysis-8su67 && exit 0
            sleep $((i*i*5))
          done
          echo 'push failed after 5 attempts'; exit 1
      - name: Fail the run if any step failed (after results are pushed)
        if: always()
        working-directory: engine
        run: python3 health.py check
